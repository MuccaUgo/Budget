  commit();
});

/* ================= backup ================= */
function backupObject(){
  return {app:'budget', format:1, exportedAt:Date.now(), transactions:Object.values(S.transactions),
          categories:Object.values(S.categories), settings:S.settings};
}
function downloadFile(file){
  const url = URL.createObjectURL(file);
  const a = document.createElement('a');
  a.href = url; a.download = file.name; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 4000);
}
function markBackedUp(){ S.meta.lastBackupAt = Date.now(); S.meta.dirty = 0; persist(); render(); }
async function deliverFile(file, title, onDone){
  if (IS_IOS && navigator.canShare && navigator.canShare({files:[file]})) {
    try { await navigator.share({files:[file], title}); onDone(true); }
    catch (e) { if (e && e.name === 'AbortError') return; downloadFile(file); onDone(false); }
    return;
  }
  if (CAN_PICK_FILE) {
    try {
      const ext = file.name.split('.').pop();
      const h = await window.showSaveFilePicker({suggestedName:file.name, types:[{description:title, accept:{[file.type]:['.' + ext]}}]});
      const w = await h.createWritable(); await w.write(file); await w.close();
      onDone(true);
    } catch (e) { if (e && e.name === 'AbortError') return; downloadFile(file); onDone(false); }
    return;
  }
  downloadFile(file); onDone(false);
}
function saveBackup(){
  const file = new File([JSON.stringify(backupObject())], `Budget-backup-${todayISO()}.json`, {type:'application/json'});
  deliverFile(file, 'Backup Budget', saved => {
    markBackedUp();
    toast(saved ? 'Backup salvato' : 'Backup scaricato: spostalo in iCloud Drive');
  });
}
function exportCSV(){
  const rows = [['Data', 'Tipo', 'Importo', 'Descrizione', 'Categoria', 'Da ricevere']];
  [...live()].reverse().forEach(t => rows.push([
    t.date.split('-').reverse().join('/'), t.type === 'in' ? 'Entrata' : 'Uscita',
    (t.amount / 100).toFixed(2).replace('.', ','), t.note, catOf(t.category) ? catOf(t.category).name : '', t.pending ? 'sì' : '']));
  const csv = '﻿' + rows.map(r => r.map(v => { const s = String(v ?? ''); return /[;"\n]/.test(s) ? `"${s.replace(/"/g, '""')}"` : s; }).join(';')).join('\r\n');
  const file = new File([csv], `Budget-${todayISO()}.csv`, {type:'text/csv'});
  deliverFile(file, 'Movimenti Budget', saved => toast(saved ? 'File CSV salvato' : 'File CSV scaricato'));
}
function validTx(t){
  if (!t || typeof t.id !== 'string' || !t.id || !/^\d{4}-\d{2}-\d{2}$/.test(t.date || '') || (t.type !== 'in' && t.type !== 'out')) return null;
  const amount = Math.round(Number(t.amount));
  if (!t.deleted && !(amount > 0)) return null;
  return {id:t.id.slice(0, 64), type:t.type, amount:amount > 0 ? amount : 0, date:t.date, note:String(t.note || '').slice(0, 80),
          category:typeof t.category === 'string' ? t.category : null, pending:!!t.pending,
          created:Number(t.created) || Number(t.updatedAt) || 0, updatedAt:Number(t.updatedAt) || 0, deleted:!!t.deleted};
}
function validCat(c){
  if (!c || typeof c.id !== 'string' || !c.id || (c.type !== 'in' && c.type !== 'out')) return null;
  return {id:c.id.slice(0, 40), name:String(c.name || 'Categoria').slice(0, 30), emoji:String(c.emoji || '🏷️').slice(0, 8), type:c.type,
          order:Number(c.order) || 0, updatedAt:Number(c.updatedAt) || 0, deleted:!!c.deleted};
}
function applyImport(d, mode){
  const wasEmpty = live().length === 0;
  if (mode === 'replace') { S.transactions = {}; S.categories = {}; }
  let added = 0, updated = 0;
  (Array.isArray(d.categories) ? d.categories : []).forEach(c => {
    const v = validCat(c); if (!v) return;
    const cur = S.categories[v.id];
    if (!cur || v.updatedAt > (cur.updatedAt || 0)) S.categories[v.id] = v;
  });
  ensureDefaults();
  d.transactions.forEach(t => {
    const v = validTx(t); if (!v) return;
    const cur = S.transactions[v.id];
    if (!cur) { S.transactions[v.id] = v; if (!v.deleted) added++; }
    else if (v.updatedAt > (cur.updatedAt || 0)) { S.transactions[v.id] = v; updated++; }
  });
  if (d.settings && (Number(d.settings.updatedAt) || 0) > (S.settings.updatedAt || 0)) {
    S.settings = {goal:Math.max(0, Math.round(Number(d.settings.goal) || 0)), updatedAt:Number(d.settings.updatedAt) || 0};
  }
  if (d.source) { S.meta.dirty = (S.meta.dirty || 0) + added + updated; }          // import da Numbers: non è ancora un backup
  else if (wasEmpty || mode === 'replace') { S.meta.dirty = 0; S.meta.lastBackupAt = Number(d.exportedAt) || Date.now(); }
  else S.meta.dirty = (S.meta.dirty || 0) + added + updated;
  ver++; persist(); askPersistentStorage(); autoBackupSoon();
  const latest = live()[0];
  if (latest && wasEmpty) UI.ym = latest.date.slice(0, 7) > curYM() ? curYM() : latest.date.slice(0, 7);
  render();
  return {added, updated};
}
async function handleRestoreFile(file){
  let d;
  try { d = JSON.parse(await file.text()); } catch (e) { d = null; }
  if (!d || d.app !== 'budget' || !Array.isArray(d.transactions)) {
    dialog({title:'File non riconosciuto', text:'Questo file non è un backup di Budget. Scegli un file .json salvato dall\'app.', buttons:[{label:'Ok', primary:true}]});
    return;
  }
  const n = d.transactions.filter(t => !t.deleted).length;
  const when = d.exportedAt ? new Date(d.exportedAt).toLocaleDateString('it-IT', {day:'numeric', month:'long', year:'numeric'}) : '';
  const done = r => toast(r.added || r.updated ? `${r.added} movimenti aggiunti${r.updated ? `, ${r.updated} aggiornati` : ''}` : 'Nessuna novità: era già tutto qui');
  if (!live().length) { done(applyImport(d, 'merge')); return; }
  dialog({
    title:'Ripristina backup',
    text:`${d.source ? 'Dati importati da Numbers' : `Backup del ${when}`}, ${n} movimenti. «Unisci» aggiunge quelli che mancano e tiene la versione più recente di ogni movimento. «Sostituisci» cancella i dati attuali.`,
    buttons:[
      {label:'Unisci ai dati attuali', primary:true, action:() => done(applyImport(d, 'merge'))},
      {label:'Sostituisci tutti i dati', danger:true, action:() => { applyImport(d, 'replace'); toast('Dati sostituiti con il backup'); }},
      {label:'Annulla'},
    ]});
}
$('#file-restore').addEventListener('change', e => {
  const f = e.target.files && e.target.files[0];
  e.target.value = '';
  if (f) handleRestoreFile(f);
});

/* ---- backup automatico (Chrome/Edge su Mac e PC) ---- */
let autoHandle = null, autoState = 'off', autoTimer = null;
const idb = {
  db:null,
  open(){
    if (this.db) return Promise.resolve(this.db);
    return new Promise((res, rej) => {
      const r = indexedDB.open('budget-files', 1);
      r.onupgradeneeded = () => r.result.createObjectStore('kv');
      r.onsuccess = () => { this.db = r.result; res(this.db); };
      r.onerror = () => rej(r.error);
    });
  },
  async op(mode, fn){ const db = await this.open(); return new Promise((res, rej) => { const tx = db.transaction('kv', mode); const q = fn(tx.objectStore('kv')); tx.oncomplete = () => res(q && q.result); tx.onerror = () => rej(tx.error); }); },
  get(k){ return this.op('readonly', s => s.get(k)); },
  set(k, v){ return this.op('readwrite', s => s.put(v, k)); },
  del(k){ return this.op('readwrite', s => s.delete(k)); },
};
async function initAuto(){
  if (!CAN_PICK_FILE) return;
  try {
    autoHandle = await idb.get('autoHandle');
    if (autoHandle) {
      const p = await autoHandle.queryPermission({mode:'readwrite'});
      autoState = p === 'granted' ? 'on' : 'needs-permission';
    }
  } catch (e) { autoState = 'off'; }
  if (UI.view === 'backup') render();
}
async function linkAuto(){
  try {
    const h = await window.showSaveFilePicker({suggestedName:'Budget-backup-automatico.json', types:[{description:'Backup Budget', accept:{'application/json':['.json']}}]});
    autoHandle = h; await idb.set('autoHandle', h);
    autoState = 'on'; S.meta.autoName = h.name;
    await writeAuto();
    toast('Backup automatico attivo');
  } catch (e) { if (!e || e.name !== 'AbortError') toast('Non riesco a usare quel file'); }
  render();
}
async function resumeAuto(){
  try {
    const p = await autoHandle.requestPermission({mode:'readwrite'});
    autoState = p === 'granted' ? 'on' : 'needs-permission';
    if (autoState === 'on') { await writeAuto(); toast('Backup automatico riattivato'); }
  } catch (e) { autoState = 'needs-permission'; }
  render();
}
async function unlinkAuto(){
  autoHandle = null; autoState = 'off';
  try { await idb.del('autoHandle'); } catch (e) {}
  toast('Backup automatico scollegato');
  render();
}
function autoBackupSoon(){
  if (autoState !== 'on') return;
  clearTimeout(autoTimer);
  autoTimer = setTimeout(writeAuto, 1200);
}
async function writeAuto(){
  if (!autoHandle) return;
  try {
    const w = await autoHandle.createWritable();
    await w.write(JSON.stringify(backupObject()));
    await w.close();
    S.meta.lastBackupAt = Date.now(); S.meta.dirty = 0; persist();
  } catch (e) { autoState = 'needs-permission'; }
  if (UI.view === 'backup') render();
}

/* ================= dialog e toast ================= */
function dialog({title, text, buttons}){
  const host = $('#dialog');
  host.innerHTML = `<div class="dlg" role="alertdialog" aria-modal="true" aria-labelledby="dlg-t"><h3 id="dlg-t">${esc(title)}</h3>${text ? `<p>${esc(text)}</p>` : ''}
    <div class="dlg-btns">${buttons.map((b, i) => `<button type="button" data-i="${i}" class="${b.primary ? 'primary' : ''}${b.danger ? ' danger' : ''}">${esc(b.label)}</button>`).join('')}</div></div>`;
  host.classList.add('show');
  host.onclick = e => {
    const bt = e.target.closest('button');
    if (!bt && e.target !== host) return;
    host.classList.remove('show'); host.onclick = null;
    if (bt) { const b = buttons[+bt.dataset.i]; if (b && b.action) b.action(); }
  };
  const first = host.querySelector('button'); if (first) first.focus({preventScroll:true});
}
let toastTimer = null;
function toast(msg, actionLabel, action){
  const t = $('#toast');
  t.innerHTML = `<span>${esc(msg)}</span>${actionLabel ? `<button type="button">${esc(actionLabel)}</button>` : ''}`;
  if (actionLabel) t.querySelector('button').onclick = () => { t.classList.remove('show'); action(); };
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), actionLabel ? 5000 : 2800);
}

const ACT = {
  'tab': el => show(el.dataset.view),
  'add': el => openEntry({kind:el.dataset.kind}),
  'open-tx': el => openEntry({id:el.dataset.id}),
  'prev-month': () => { UI.ym = addMonths(UI.ym, -1); render(); },
  'next-month': () => { UI.ym = addMonths(UI.ym, 1); render(); },
  'this-month': () => { UI.ym = curYM(); render(); },
  'filter-cat': el => { UI.cat = el.dataset.cat; UI.type = 'all'; UI.q = ''; $('#q').value = ''; show('list'); },
  'clear-cat': () => { UI.cat = null; render(); },
  'type-filter': el => { UI.type = el.dataset.type; render(); },
  'clear-q': () => { UI.q = ''; $('#q').value = ''; render(); },
  'period': el => { UI.period = +el.dataset.n; render(); },
  'save-backup': () => saveBackup(),
  'restore': () => $('#file-restore').click(),
  'link-auto': () => linkAuto(),
  'resume-auto': () => resumeAuto(),
  'unlink-auto': () => dialog({title:'Scollegare il backup automatico?', text:'Il file resta dov\'è, ma non verrà più aggiornato.', buttons:[{label:'Scollega', danger:true, action:unlinkAuto}, {label:'Annulla'}]}),
  'export-csv': () => exportCSV(),
  'manage-cats': () => openCats(),
  'close-cats': () => closeLayer($('#cat-sheet')),
  'cat-kind': el => { UI.catKind = el.dataset.kind; paintCatList(); },
  'add-cat': () => {
    const list = catsOf(UI.catKind);
    const c = {id:'c' + Date.now().toString(36), name:'Nuova categoria', emoji:'🏷️', type:UI.catKind, order:(list.length ? Math.max(...list.map(x => x.order)) : 0) + 1, updatedAt:Date.now()};
    S.categories[c.id] = c; commit(); paintCatList();
    const inp = $(`#cat-list .cat-edit[data-id="${c.id}"] .name-in`); if (inp) { inp.focus(); inp.select(); }
  },
  'del-cat': el => {
    const id = el.closest('.cat-edit').dataset.id, c = S.categories[id]; if (!c) return;
    const n = live().filter(t => t.category === id).length;
    dialog({title:`Eliminare «${c.name}»?`, text:n ? `${n === 1 ? 'Un movimento resterà' : `${n} movimenti resteranno`} senza categoria.` : '',
      buttons:[{label:'Elimina', danger:true, action:() => { S.categories[id] = {...c, deleted:true, updatedAt:Date.now()}; commit(); paintCatList(); }}, {label:'Annulla'}]});
  },
  'wipe': () => dialog({title:'Cancellare tutti i dati?', text:'Movimenti, categorie e impostazioni spariscono da questo dispositivo. I backup su iCloud Drive non vengono toccati.',
    buttons:[{label:'Cancella tutto', danger:true, action:() => { const m = S.meta; S = blank(); S.meta.hintDismissed = m.hintDismissed; ensureDefaults(); ver++; persist(); toast('Dati cancellati'); render(); }}, {label:'Annulla'}]}),
  'dismiss-hint': () => { S.meta.hintDismissed = true; persist(); render(); },
  'goto-goal': () => { show('backup'); setTimeout(() => { const g = $('#goal-in'); if (g) { g.scrollIntoView({block:'center'}); g.focus(); } }, 60); },
};
document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]');
  if (!el) return;
  const fn = ACT[el.dataset.act];
  if (fn) fn(el, e);
});
$('#q').addEventListener('input', e => { UI.q = e.target.value; renderList(); });
$('#q').addEventListener('keydown', e => { if (e.key === 'Enter') e.target.blur(); });
document.addEventListener('change', e => {
  if (e.target.id !== 'goal-in') return;
  const raw = e.target.value.replace(/[^\d,.]/g, '').replace(/\./g, '').replace(',', '.');
  const v = Math.max(0, Math.round((parseFloat(raw) || 0) * 100));
  S.settings = {goal:v, updatedAt:Date.now()};
  commit();
  toast(v ? `Obiettivo: ${eur0(v)} al mese` : 'Obiettivo rimosso');
});
document.addEventListener('keydown', e => { if (e.target.id === 'goal-in' && e.key === 'Enter') e.target.blur(); });

let lastW = window.innerWidth;
window.addEventListener('resize', () => { if (Math.abs(window.innerWidth - lastW) > 20) { lastW = window.innerWidth; render(); } });
let lastToday = todayISO();
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState !== 'visible') return;
  const t = todayISO();
  if (t !== lastToday) { if (UI.ym === lastToday.slice(0, 7)) UI.ym = t.slice(0, 7); lastToday = t; }
  render();
});

/* ================= avvio ================= */
load();
show('home');
initAuto();
if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')) {
  window.addEventListener('load', () => navigator.serviceWorker.register('./sw.js').catch(() => {}));
}
window.__budget = {S:() => S, monthStats, live, applyImport, UI};
})();
</script>
</body>
</html>
